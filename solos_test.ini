; ==========================================================================
; solos_test.ini  --  SOLOS -> SFIS automatic test flow configuration
; Used by run_solos_test.bat and tools\wait_for_solos_pair.py
; Inline comments start with ';' or '#'.
; ==========================================================================

[TEST]
; Folder to watch for the SOLOS XML+PDF pair. Blank = the BAT folder.
watch_dir =

; XML file pattern (SN/date/time are parsed from the file name).
xml_pattern = *_TOPCON_SOLOS_00000.xml
pdf_suffix  = _Spectacles_Report.pdf

; Polling and completeness. Size + mtime must stay unchanged after first detection.
poll_seconds   = 2
stable_seconds = 5
wait_timeout   = 600
use_existing   = 0

; Output. Final CSV = output_dir\<SN>\Lensometer.csv
output_dir = output
; Completed XML/PDF and a CSV snapshot, in a unique subfolder for each run.
archive_dir = archive

; External commands (relative paths are resolved against this folder).
converter   = solos_xml_to_pcbafct.py
sfis_script = RESTSFIS-diag\RESTSFIS-diag.py
sfis_ini    = RESTSFIS-diag\RESTSFIS-diag.ini

; SFIS upload parameters.
; operator : employee id passed to /UP as -op (blank = omit).
; dry_run  : 1 = add --dry-run to RESTSFIS-diag (no network).
; retry    : retries for /C and /UP on transient failures (exit 11/12).
; once     : 1 = run a single cycle then exit (0 = keep looping).
operator =
dry_run  = 0
retry    = 2
once     = 0

[SCREEN]
; screen-diag status display.
enabled = 1

; Folder that holds Screen-diag.exe and UILogResult-auto.exe.
; Blank = this (BAT) folder. Set a path if the tools live elsewhere,
; e.g. D:\ML_Robocal\ML_Robocal_1.00a_20260804\Tools
screen_dir =
screen_exe = Screen-diag.exe
uilogresult_exe = UILogResult-auto.exe

; Messages.
wait_message = waiting for (xml) files...
pass_message = PASS
